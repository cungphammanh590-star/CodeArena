<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CodeArena</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 12px 14px;
        width: 320px;
        color: #3f3a38;
        background: #f7f1ef;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      h2 {
        font-size: 12px;
        margin: 14px 0 6px;
        color: #c67a88;
        font-weight: 650;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        margin: 6px 0;
      }
      .ok { color: #6d9f82; font-weight: 600; }
      .bad { color: #c97878; font-weight: 600; }
      .muted { color: #948984; font-size: 11px; line-height: 1.45; }
      button {
        width: 100%;
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px;
        background: #c67a88;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }
      button.coach { background: #9b8ec4; }
      button.secondary {
        background: #eadfd9;
        color: #3f3a38;
      }
      button:disabled {
        background: #e8ddd8;
        color: #b5ada8;
        cursor: not-allowed;
      }
      #last { margin-top: 8px; font-size: 11px; word-break: break-word; }
      .coach-card {
        background: #f4f0f8;
        border: 1px solid #ddd4eb;
        border-radius: 8px;
        padding: 10px;
        margin-top: 4px;
      }
      #coach-suggestion {
        font-size: 12px;
        line-height: 1.5;
        color: #5d5285;
        white-space: pre-wrap;
      }
      #coach-meta { margin-top: 6px; font-size: 11px; color: #948984; }
    </style>
  </head>
  <body>
    <h1>CodeArena</h1>
    <div class="row"><span>状态</span><span id="status-label">检测中…</span></div>
    <div class="row"><span>账号</span><span id="user-label" class="muted">—</span></div>

    <h2>本题陪练建议</h2>
    <div class="coach-card">
      <div id="coach-title" class="muted">检测当前题目…</div>
      <div id="coach-suggestion" class="muted">—</div>
      <div id="coach-meta"></div>
    </div>
    <button id="open-coach" class="coach" type="button" disabled>打开陪练</button>
    <button id="open-problem" class="secondary" type="button" disabled>题目详情</button>
    <button id="daily-review" class="secondary" type="button" disabled>今日总结</button>
    <button id="review-queue" class="secondary" type="button" disabled>今日复习</button>
    <button id="recommend-next" class="secondary" type="button" disabled>推荐下一题</button>

    <div id="last" class="muted">最近一次：尚无记录</div>
    <button id="open-dashboard" type="button" disabled>打开仪表盘</button>
    <button id="open-options" class="secondary" type="button">账号登录</button>
    <button id="refresh" class="secondary" type="button">刷新</button>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
