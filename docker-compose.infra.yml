# CodeArena infra-only: postgres + redis + nacos
#   docker compose -f docker-compose.infra.yml up -d

name: codearena-infra

services:
  postgres:
    image: postgres:16
    container_name: codearena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearena}
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codearena_pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena} -d ${POSTGRES_DB:-codearena}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # RedisJSON 等模块：LangGraph checkpoint 需要 JSON.SET
    image: redis/redis-stack-server:latest
    container_name: codearena-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - codearena_redis_data:/data
    environment:
      REDIS_ARGS: "--appendonly yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: codearena-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "9848:9848"
    volumes:
      - codearena_nacos_data:/home/nacos/data

volumes:
  codearena_pg_data:
  codearena_redis_data:
  codearena_nacos_data:
