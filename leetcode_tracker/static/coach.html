<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>陪练 · LeetCode Tracker</title>
  <style>
    :root {
      --bg: #f4f1eb;
      --ink: #1c1917;
      --muted: #78716c;
      --card: #fffcf7;
      --line: #e7e5e4;
      --accent: #0f766e;
      --coach: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 20px 24px 8px;
      max-width: 720px;
      margin: 0 auto;
    }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
    main { max-width: 720px; margin: 0 auto; padding: 8px 24px 32px; }
    .banner {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .chat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 360px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 92%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .msg.coach {
      background: #ede9fe;
      color: #4c1d95;
      align-self: flex-start;
    }
    .msg.user {
      background: #ccfbf1;
      color: #134e4a;
      align-self: end;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .actions button.secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .actions button.secondary:disabled {
      opacity: 0.4;
    }
    .composer {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input, button { font: inherit; }
    input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: var(--coach);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>刷题陪练</h1>
    <p class="sub">双图陪练 · 检测在图内、出口在 UI · 数据仅在本机</p>
  </header>
  <main>
    <div id="banner" class="banner"></div>
    <div id="chat" class="chat"></div>
    <div class="actions" id="actions">
      <button type="button" class="secondary" id="btn-close" disabled>结束本轮</button>
      <button type="button" class="secondary" id="btn-review" disabled>今日总结</button>
      <button type="button" class="secondary" id="btn-recommend" disabled>推荐下一题</button>
      <button type="button" class="secondary" id="btn-skeleton" disabled>看思路</button>
      <button type="button" class="secondary" id="btn-diagnose" disabled>结束并诊断</button>
      <button type="button" class="secondary" id="btn-deep" disabled>查看精析</button>
    </div>
    <div class="composer">
      <input id="input" type="text" placeholder="说说你的怀疑点…" disabled />
      <button id="send" type="button" disabled>发送</button>
    </div>
    <p class="sub" style="margin-top:12px">
      <a href="/">返回仪表盘</a> · 也可输入「结束」收束
    </p>
  </main>
  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const bannerEl = document.getElementById("banner");
    const btnClose = document.getElementById("btn-close");
    const btnReview = document.getElementById("btn-review");
    const btnRecommend = document.getElementById("btn-recommend");
    const btnSkeleton = document.getElementById("btn-skeleton");
    const btnDiagnose = document.getElementById("btn-diagnose");
    const btnDeep = document.getElementById("btn-deep");

    const params = new URLSearchParams(location.search);
    const submission = params.get("submission");
    const problemId = params.get("problem_id");
    const modeParam = params.get("mode") || "";
    const actionParam = params.get("action") || "";
    let sessionId = params.get("session");
    let busy = false;
    let preparePromise = null;
    let graphMode = "local"; // local | api
    let exitOffered = false;

    function addMsg(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function showBanner(text) {
      bannerEl.textContent = text;
      bannerEl.style.display = "block";
    }

    function hideBanner() {
      bannerEl.textContent = "";
      bannerEl.style.display = "none";
    }

    function syncActionButtons() {
      const ready = Boolean(sessionId) && !busy;
      btnClose.disabled = !ready;
      btnReview.disabled = !ready;
      btnRecommend.disabled = !ready;
      if (graphMode === "api") {
        btnSkeleton.disabled = true;
        btnDiagnose.disabled = !ready;
        btnDeep.disabled = !ready;
      } else {
        btnDiagnose.disabled = true;
        btnDeep.disabled = true;
        btnSkeleton.disabled = !ready;
        if (!exitOffered && ready) {
          btnSkeleton.title = "随时可看思路；失稳后会高亮提示";
        }
      }
    }

    function enableComposer() {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      syncActionButtons();
      inputEl.focus();
    }

    function disableComposer() {
      inputEl.disabled = true;
      sendBtn.disabled = true;
      syncActionButtons();
    }

    async function loadCachedSession(submissionId, pid) {
      const query = submissionId
        ? "submission_id=" + encodeURIComponent(submissionId)
        : "problem_id=" + encodeURIComponent(pid);
      const res = await fetch("/api/coach/session?" + query);
      if (!res.ok) return null;
      return res.json();
    }

    async function prepare(submissionId, pid, mode) {
      if (preparePromise) return preparePromise;
      preparePromise = (async () => {
        showBanner("正在创建本地陪练会话…");
        const body = {
          submission_id: submissionId || "",
          problem_id: pid ? Number(pid) : null,
        };
        if (mode) body.mode = mode;
        const res = await fetch("/api/coach/prepare", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "prepare failed");
        return data;
      })();
      try {
        return await preparePromise;
      } finally {
        preparePromise = null;
      }
    }

    async function startWithMode(mode) {
      const data = await prepare("", null, mode);
      sessionId = data.session_id;
      addMsg(data.opening, "coach");
      hideBanner();
      enableComposer();
      const bootAction = actionParam || mode;
      if (bootAction === "daily_review" || bootAction === "recommend") {
        await sendPayload({ action: bootAction });
      }
    }

    async function startWithSubmission(submissionId, pid) {
      let data = await loadCachedSession(submissionId, pid);
      if (data && data.session_id) {
        sessionId = data.session_id;
        addMsg(data.opening, "coach");
        hideBanner();
        enableComposer();
        return;
      }
      data = await prepare(submissionId, pid, "");
      sessionId = data.session_id;
      addMsg(data.opening, "coach");
      if (data.fallback_used) {
        showBanner(
          "指定提交未找到，已使用本题最近提交 " +
          data.resolved_submission_id +
          " 启动陪练。"
        );
      } else if (data.opening_source === "template") {
        const modeHint = graphMode === "api" ? "DeepSeek" : "本地模型";
        showBanner("已用本地模板启动；发送消息时才会调用 " + modeHint + "。");
      } else {
        hideBanner();
      }
      enableComposer();
    }

    async function loadHint(pid) {
      const res = await fetch("/api/coach/hint/" + encodeURIComponent(pid));
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "hint failed");
      if (data.latest_submission_id) {
        await startWithSubmission(String(data.latest_submission_id), String(pid));
        return;
      }
      addMsg(data.suggestion || "暂无建议", "coach");
      showBanner("尚无可用提交记录；在力扣提交后会自动关联最近结果。");
    }

    async function readSse(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const block of parts) {
          let event = "message";
          let dataLine = "";
          for (const line of block.split("\n")) {
            if (line.startsWith("event:")) event = line.slice(6).trim();
            if (line.startsWith("data:")) dataLine += line.slice(5).trim();
          }
          if (!dataLine) continue;
          try {
            onEvent(event, JSON.parse(dataLine));
          } catch (_e) {
            /* ignore */
          }
        }
      }
    }

    async function sendPayload({ text, action }) {
      if (!sessionId || busy) return;
      const hasAction = Boolean(action);
      const hasText = Boolean(text && text.trim());
      if (!hasAction && !hasText) return;

      busy = true;
      syncActionButtons();
      sendBtn.disabled = true;

      if (hasText) addMsg(text.trim(), "user");
      else if (hasAction) {
        const label = {
          close: "结束本轮",
          show_skeleton: "看思路",
          diagnose: "结束并诊断",
          deep_analysis: "查看精析",
          daily_review: "今日总结",
          recommend: "推荐下一题",
          optimize: "优化分析",
        }[action] || action;
        addMsg("〔" + label + "〕", "user");
      }
      inputEl.value = "";
      const coachDiv = addMsg("", "coach");
      try {
        const res = await fetch("/api/coach/stream", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "text/event-stream",
          },
          body: JSON.stringify({
            session_id: sessionId,
            message: hasText ? text.trim() : "",
            action: action || "",
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showBanner(data.message || "发送失败");
          coachDiv.remove();
          if (data.reopen_required || data.code === "session_abandoned") {
            disableComposer();
            sessionId = "";
          }
          return;
        }
        let finished = false;
        await readSse(res, (event, data) => {
          if (event === "ready" || data.type === "ready") {
            if (data.graph) graphMode = data.graph;
            syncActionButtons();
          } else if (
            event === "token" ||
            data.type === "token" ||
            event === "answer_egress" ||
            data.type === "answer_egress" ||
            event === "diagnose" ||
            data.type === "diagnose" ||
            event === "deep_analysis" ||
            data.type === "deep_analysis"
          ) {
            if (data.text) {
              coachDiv.textContent += data.text;
              chatEl.scrollTop = chatEl.scrollHeight;
            }
          } else if (event === "offer_exit" || data.type === "offer_exit") {
            exitOffered = true;
            showBanner(data.message || "可以结束或看思路了");
            syncActionButtons();
          } else if (event === "fallback" || data.type === "fallback") {
            coachDiv.textContent += data.text || "";
            showBanner(data.message || "模型不可用，已降级。");
            if (data.reopen_required || data.session_abandoned) {
              disableComposer();
              sessionId = "";
            }
          } else if (event === "error" || data.type === "error") {
            showBanner(data.message || "对话出错");
            if (data.reopen_required || data.code === "session_abandoned") {
              disableComposer();
              sessionId = "";
            }
          } else if (event === "done" || data.type === "done") {
            finished = true;
            if (data.done) disableComposer();
          }
        });
        if (!coachDiv.textContent) {
          coachDiv.textContent = finished ? "" : "（无回复）";
        }
      } catch (err) {
        coachDiv.remove();
        showBanner(err.message || "发送失败");
      } finally {
        busy = false;
        if (!inputEl.disabled) {
          sendBtn.disabled = false;
          syncActionButtons();
        }
      }
    }

    function sendMessage() {
      return sendPayload({ text: inputEl.value, action: "" });
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
    btnClose.addEventListener("click", () => sendPayload({ action: "close" }));
    btnReview.addEventListener("click", () => sendPayload({ action: "daily_review" }));
    btnRecommend.addEventListener("click", () => sendPayload({ action: "recommend" }));
    btnSkeleton.addEventListener("click", () => sendPayload({ action: "show_skeleton" }));
    btnDiagnose.addEventListener("click", () => sendPayload({ action: "diagnose" }));
    btnDeep.addEventListener("click", () => sendPayload({ action: "deep_analysis" }));

    (async function init() {
      try {
        const health = await fetch("/health").then((r) => r.json());
        if (!health.coach_available) {
          showBanner("未安装陪练依赖：pip install 'leetcode-tracker[coach]'");
          return;
        }
        graphMode = health.llm_provider === "api" ? "api" : "local";
        const profileMode =
          modeParam === "daily_review" || modeParam === "recommend"
            ? modeParam
            : "";
        if (profileMode) {
          await startWithMode(profileMode);
          return;
        }
        if (!health.kg_imported) {
          showBanner("知识图谱未导入：leetcode-tracker kg import");
          return;
        }
        if (sessionId) {
          addMsg("继续会话 " + sessionId + "（直接输入即可）", "coach");
          enableComposer();
          return;
        }
        if (submission) {
          await startWithSubmission(submission, problemId);
          return;
        }
        if (problemId) {
          await loadHint(problemId);
          return;
        }
        showBanner("缺少 submission、problem_id 或 mode 参数");
      } catch (err) {
        showBanner("本机服务不可用，请先运行 leetcode-tracker serve");
      }
    })();
  </script>
</body>
</html>
