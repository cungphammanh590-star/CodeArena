# Activate with: --spring.profiles.active=nacos
spring:
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      routes:
        - id: llm-coach-stream
          uri: lb://llm-service
          predicates:
            - Path=/api/coach/stream
          filters:
            - name: CircuitBreaker
              args:
                name: llmService
                fallbackUri: forward:/fallback/llm
        - id: domain-users
          uri: lb://business-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: businessService
                fallbackUri: forward:/fallback/business
        - id: business-api
          uri: lb://business-service
          predicates:
            - Path=/api/**
          filters:
            - name: CircuitBreaker
              args:
                name: businessService
                fallbackUri: forward:/fallback/business
        - id: business-submit
          uri: lb://business-service
          predicates:
            - Path=/submit
          filters:
            - name: CircuitBreaker
              args:
                name: businessService
                fallbackUri: forward:/fallback/business
        - id: business-health
          uri: lb://business-service
          predicates:
            - Path=/health
          filters:
            - name: CircuitBreaker
              args:
                name: businessService
                fallbackUri: forward:/fallback/business
