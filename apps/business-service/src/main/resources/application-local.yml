# Activate with: --spring.profiles.active=local
# 本机 Postgres：库 codearena / 用户 codearena / 密码 zephyr

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codearena}
    username: ${POSTGRES_USER:codearena}
    password: ${POSTGRES_PASSWORD:zephyr}
    driver-class-name: org.postgresql.Driver
    hikari:
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_MS:20000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # 本机历史迁移文件偶发改过导致 checksum 漂移；repair 后再 migrate
    repair-on-migrate: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false

management:
  health:
    db:
      enabled: true
    redis:
      enabled: false

codearena:
  cache:
    # 本机默认不连 Redis；Docker / 有 redis-stack 时可 CODEARENA_CACHE_REDIS_ENABLED=true
    redis-enabled: ${CODEARENA_CACHE_REDIS_ENABLED:false}
    stats-enabled: ${CODEARENA_CACHE_STATS_ENABLED:true}

# SQL 可见性：默认 INFO；调试时 CODEARENA_SQL_LOG_LEVEL=DEBUG
logging:
  level:
    com.codearena.business: INFO
    org.hibernate.SQL: ${CODEARENA_SQL_LOG_LEVEL:INFO}
    org.hibernate.orm.jdbc.bind: ${CODEARENA_SQL_BIND_LEVEL:WARN}
