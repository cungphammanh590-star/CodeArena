server:
  port: 8090
  address: 0.0.0.0

spring:
  application:
    name: business-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${CODEARENA_KNOWLEDGE_MAX_UPLOAD_MB:80}MB
      max-request-size: ${CODEARENA_KNOWLEDGE_MAX_UPLOAD_MB:80}MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codearena}
    username: ${POSTGRES_USER:codearena}
    password: ${POSTGRES_PASSWORD:zephyr}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_MS:0}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  mail:
    host: ${CODEARENA_SMTP_HOST:}
    port: ${CODEARENA_SMTP_PORT:587}
    username: ${CODEARENA_SMTP_USERNAME:}
    password: ${CODEARENA_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${CODEARENA_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${CODEARENA_SMTP_STARTTLS:true}
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        enabled: false
        fail-fast: false
        register-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    redis:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

logging:
  level:
    com.codearena.business: INFO
    org.hibernate.SQL: ${CODEARENA_SQL_LOG_LEVEL:INFO}
    org.hibernate.orm.jdbc.bind: ${CODEARENA_SQL_BIND_LEVEL:WARN}

codearena:
  internal:
    # llm-service 回调 /internal/tools/** 时需携带同值 X-Internal-Token
    token: ${CODEARENA_INTERNAL_TOKEN:codearena-internal-dev}
  llm:
    # 可选：AES 加密用户 api_key；未设置则明文存储（仅开发）
    key-secret: ${CODEARENA_LLM_KEY_SECRET:}
    # /health 探测陪练进程（前端 coach_available）
    base-url: ${CODEARENA_LLM_URI:http://127.0.0.1:8091}
  auth:
    # JWT 有效期（天）；Gateway / business 共用同一密钥
    token-ttl-days: ${CODEARENA_AUTH_TOKEN_TTL_DAYS:30}
    jwt-secret: ${CODEARENA_JWT_SECRET:codearena-dev-jwt-secret-change-me-32b}
    jwt-issuer: ${CODEARENA_JWT_ISSUER:codearena}
  security:
    # prod/production profile 下拒绝默认密钥；可用 CODEARENA_STRICT_SECRETS=false 应急关闭
    strict-secrets: ${CODEARENA_STRICT_SECRETS:true}
  cache:
    redis-enabled: ${CODEARENA_CACHE_REDIS_ENABLED:true}
    stats-enabled: ${CODEARENA_CACHE_STATS_ENABLED:true}
    stats-ttl-seconds: ${CODEARENA_CACHE_STATS_TTL_SECONDS:3600}
  knowledge:
    enabled: ${CODEARENA_KNOWLEDGE_ENABLED:true}
    storage-dir: ${CODEARENA_KNOWLEDGE_STORAGE_DIR:${user.home}/.codearena/knowledge}
    llm-clean-enabled: ${CODEARENA_KNOWLEDGE_LLM_CLEAN:false}
    llm-refine-enabled: ${CODEARENA_KNOWLEDGE_LLM_REFINE:false}
    max-raw-chars: ${CODEARENA_KNOWLEDGE_MAX_RAW_CHARS:200000}
    max-knowledge-points: ${CODEARENA_KNOWLEDGE_MAX_KPS:200}
    qdrant:
      url: ${CODEARENA_QDRANT_URL:http://127.0.0.1:6333}
      collection: ${CODEARENA_QDRANT_COLLECTION:leetmate_user_kb}
      api-key: ${CODEARENA_QDRANT_API_KEY:}
    embedding:
      provider: ${CODEARENA_EMBEDDING_PROVIDER:mock}
      model: ${CODEARENA_EMBEDDING_MODEL:mock-hash-v1}
      version: ${CODEARENA_EMBEDDING_VERSION:1}
      dim: ${CODEARENA_EMBEDDING_DIM:384}
      http-url: ${CODEARENA_EMBEDDING_HTTP_URL:}
      http-api-key: ${CODEARENA_EMBEDDING_HTTP_API_KEY:}
    llm:
      http-url: ${CODEARENA_KNOWLEDGE_LLM_URL:}
      http-api-key: ${CODEARENA_KNOWLEDGE_LLM_API_KEY:}
      model: ${CODEARENA_KNOWLEDGE_LLM_MODEL:}
  mail:
    enabled: ${CODEARENA_MAIL_ENABLED:false}
    from: ${CODEARENA_MAIL_FROM:no-reply@codearena.local}
