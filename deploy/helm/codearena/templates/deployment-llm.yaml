{{- if .Values.llm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearena.fullname" . }}-llm
  labels:
    app.kubernetes.io/name: llm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.llm.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: llm
          image: "{{ .Values.llm.image.repository }}:{{ .Values.llm.image.tag }}"
          imagePullPolicy: {{ .Values.llm.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.llm.service.port }}
              name: http
          env:
            {{- range $k, $v := .Values.llm.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.llm.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearena.fullname" . }}-llm
spec:
  type: {{ .Values.llm.service.type }}
  selector:
    app.kubernetes.io/name: llm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.llm.service.port }}
      targetPort: http
      name: http
{{- end }}
