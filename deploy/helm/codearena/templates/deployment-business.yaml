{{- if .Values.business.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codearena.fullname" . }}-business
  labels:
    app.kubernetes.io/name: business
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.business.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: business
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: business
          image: "{{ .Values.business.image.repository }}:{{ .Values.business.image.tag }}"
          imagePullPolicy: {{ .Values.business.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.business.service.port }}
              name: http
          resources:
            {{- toYaml .Values.business.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codearena.fullname" . }}-business
spec:
  type: {{ .Values.business.service.type }}
  selector:
    app.kubernetes.io/name: business
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.business.service.port }}
      targetPort: http
      name: http
{{- end }}
