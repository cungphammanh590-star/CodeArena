nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: codearena/gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources: {}

business:
  enabled: true
  replicaCount: 1
  image:
    repository: codearena/business-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  resources: {}

llm:
  enabled: true
  replicaCount: 1
  image:
    repository: codearena/llm-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8091
  env:
    LLM_PROVIDER: mock
  resources: {}

web:
  enabled: true
  replicaCount: 1
  image:
    repository: codearena/web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: codearena.local
      paths:
        - path: /
          pathType: Prefix
          service: web
          port: 80
        - path: /api
          pathType: Prefix
          service: gateway
          port: 8080
