# 本机开发：采集 /tmp/codearena-*.log，推到本机 Loki :3100
# 运行：docker run --rm -v ... grafana/promtail ...
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-local-positions.yaml

clients:
  - url: http://host.docker.internal:3100/loki/api/v1/push

scrape_configs:
  - job_name: codearena-local-files
    static_configs:
      - targets: [localhost]
        labels:
          job: codearena-local
          __path__: /tmp/codearena-*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            message: message
            request_id: request_id
            tool_name: tool_name
      - labels:
          level:
          service:
          request_id:
          tool_name:
